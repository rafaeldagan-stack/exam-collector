---
# Tasks for the Exam Collector role

- name: Close exam applications if running
  ansible.windows.win_shell: |
    $process = Get-Process "{{ item }}" -ErrorAction SilentlyContinue
    if ($process) {
      $process | Stop-Process
      Write-Output "{{ item }} closed"
    }
    else {
      Write-Output "{{ item }} not running"
    }
  loop: "{{ exam_processes }}"

- name: Find directories directly under exam drive
  ansible.windows.win_find:
    paths: "{{ exam_drive }}"
    file_type: directory
    recurse: false
  register: all_dirs

- name: Filter student exam directories
  ansible.builtin.set_fact:
    exam_dirs: >-
      {{
        all_dirs.files
        | selectattr('filename', 'search', exam_folder_pattern)
        | list
      }}

- name: Show matched exam directories
  ansible.builtin.debug:
    msg: "Exam directory found: {{ item.path }}"
  loop: "{{ exam_dirs }}"

- name: Find files inside exam directories
  ansible.windows.win_find:
    paths: "{{ item.path }}"
    file_type: file
    recurse: true
  loop: "{{ exam_dirs }}"
  register: student_exam_files

- name: Calculate exam collection statistics
  ansible.builtin.set_fact:
    total_exam_files: >-
      {{
        student_exam_files.results
        | map(attribute='matched')
        | sum
      }}
    total_exam_bytes: >-
      {{
        student_exam_files.results
        | map(attribute='files')
        | flatten
        | map(attribute='size')
        | sum
      }}

- name: Collect exam files
  ansible.builtin.fetch:
    src: "{{ item.1.path }}"
    dest: "{{ collection_root }}/{{ inventory_hostname }}/{{ item.0.item.filename }}/"
    flat: true
  loop: "{{ student_exam_files.results | subelements('files') }}"

- name: Show collection summary
  ansible.builtin.debug:
    msg:
      - "Computer: {{ inventory_hostname }}"
      - "Student folders found: {{ exam_dirs | length }}"
      - "Exam files found: {{ total_exam_files }}"
      - "Total size: {{ total_exam_bytes }} bytes"
      - "Total size MB: {{ (total_exam_bytes | float / 1024 / 1024) | round(2) }} MB"
      - "Collection status: {{ 'WARNING - Student folder not found!' if exam_dirs | length == 0 else ('WARNING - Student folder is empty!' if total_exam_files | int == 0 else 'SUCCESS - Exam files collected successfully') }}"
- name: Save collection report
  ansible.builtin.copy:
    dest: "/home/rafi/exam-collector/reports/{{ inventory_hostname }}-report.txt"
    content: |
      Exam Collection Report
      ======================
      Collection time: {{ lookup('pipe', 'date "+%Y-%m-%d %H:%M:%S"') }}
      Computer: {{ inventory_hostname }}
      Student folder(s):
      {% for student in exam_dirs %}
      - {{ student.filename }} ({{ student.path }})
      {% endfor %}
      Student folders found: {{ exam_dirs | length }}
      Exam files found: {{ total_exam_files }}
      Total size: {{ total_exam_bytes }} bytes
      Total size MB: {{ (total_exam_bytes | float / 1024 / 1024) | round(2) }} MB
      Collection status: {{ 'WARNING - Student folder not found!' if exam_dirs | length == 0 else ('WARNING - Student folder is empty!' if total_exam_files | int == 0 else 'SUCCESS - Exam files collected successfully') }}
  delegate_to: localhost
